[package]
name = "mp5-wick-replay"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["baseline-stock-context"]

[dependencies]
stock-context = { path = "../../crates/stock-context" }
stock-context-baseline = { path = "baseline-stock-context" }
market-events = { path = "../../crates/market-events" }
market-archive = { path = "../../crates/market-archive" }
market-replay = { path = "../../crates/market-replay" }
chart-engine = { path = "../../crates/chart-engine" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
