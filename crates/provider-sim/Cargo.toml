[package]
name = "provider-sim"
description = "Local Alpaca/FMP-compatible REST and WebSocket surface served from replay (simulation only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
market-events = { path = "../market-events" }
market-archive = { path = "../market-archive" }
market-replay = { path = "../market-replay" }
market-providers = { path = "../market-providers" }
chart-engine = { path = "../chart-engine" }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
