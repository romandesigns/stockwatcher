[package]
name = "market-archive"
description = "On-disk archive of normalized market events: per day/symbol zstd files, manifests, checksums, fixture days"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
market-events = { path = "../market-events" }
# Only for its evidence types (crate::baseline turns stored daily bars into them). stock-context
# depends on market-events alone, so there is no cycle.
stock-context = { path = "../stock-context" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10.4"
fs4 = "1.1.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
zstd = "0.14.3"

[dev-dependencies]
tempfile = "3.27.0"
