[package]
name = "stock-context"
description = "Causal per-symbol stock context (five-pillar measurements, three-valued qualification, append-only decisions)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
market-events = { path = "../market-events" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
