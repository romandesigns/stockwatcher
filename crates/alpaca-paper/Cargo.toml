[package]
name = "alpaca-paper"
description = "Chart trading routed to an Alpaca PAPER account (hard-locked to paper-api.alpaca.markets)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
paper-broker = { path = "../paper-broker" }
market-events = { path = "../market-events" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "sync", "time"] }
tracing = "0.1.44"
# Every crate below is already in Cargo.lock at these versions (the server's Expo push client,
# the market data stream): no new third-party code. ring + the platform verifier, no OpenSSL.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time", "test-util"] }
