[package]
name = "stockwatcher-server"
description = "stockwatcher HTTP/WebSocket server: /api, /ws and the built web app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chart-engine = { path = "../chart-engine" }
market-archive = { path = "../market-archive" }
stock-context = { path = "../stock-context" }
market-events = { path = "../market-events" }
market-providers = { path = "../market-providers" }
paper-broker = { path = "../paper-broker" }
provider-sim = { path = "../provider-sim" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Phone alerts through Expo's push service (src/alerts/push.rs). Already in Cargo.lock (the
# importer and the desktop updater): same versions, ring provider, the platform verifier.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
# The process allocator (src/main.rs): MIT, Microsoft's, widely deployed. Pinned to the v2 line
# (the long-standing stable one; the crate defaults to v3 now). Statically linked C, built by
# `cc` with the gcc already in the Docker build stage; nothing changes in the distroless runtime.
#
# `no_thp` (2026-10-23): mimalloc otherwise madvises every 1 GiB arena MADV_HUGEPAGE, and the VPS
# runs THP in `madvise` mode with khugepaged's max_ptes_none at 511, so a 2 MiB range with a
# single live 4 KiB page is collapsed back into a whole huge page after mimalloc returned the
# rest. Production showed it: 19 GB RSS, 11.2 GB of it AnonHugePages, khugepaged collapsing in
# the quiet after-hours while the heap had nothing new to hold. Without the madvise the host's
# THP never applies to this process. It is a compile-time define (MI_NO_THP) in the C build.
mimalloc = { version = "0.1.52", default-features = false, features = ["v2", "no_thp"] }
# mimalloc's own process figures for the `MEM_STATS_SECS` log line (src/main.rs): the library
# `mimalloc` already links, with its extended API (`mi_process_info`) declared. Same features,
# so it is one build of the C library, not two.
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["v2", "extended", "no_thp"] }

[dev-dependencies]
market-replay = { path = "../market-replay" }
futures-util = "0.3.34"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
