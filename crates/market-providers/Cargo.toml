[package]
name = "market-providers"
description = "MarketDataProvider boundary: ReplayProvider (archive) and LiveProvider (Alpaca stream)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The real HTTP client and the `swimport` command (provider history import). Off by default so
# the server, which links this crate, does not compile an HTTP stack it never uses. (TLS itself
# is no longer optional: the live stream client needs it.)
import = ["dep:reqwest", "dep:flate2"]

[[bin]]
name = "swimport"
required-features = ["import"]

[dependencies]
chart-engine = { path = "../chart-engine" }
market-events = { path = "../market-events" }
market-archive = { path = "../market-archive" }
market-replay = { path = "../market-replay" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
# `signal`: `swimport maintain` stops cleanly on SIGTERM (compose stop). Already compiled for the
# server, so no new crate.
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
serde_json = "1.0.154"
# Same versions the workspace already locks (via the desktop updater); ring, not aws-lc, so it
# builds on Windows and the Pi without CMake/NASM.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Live stream (Alpaca market data WebSocket). Every crate below was already in Cargo.lock
# (tokio-tungstenite 0.30 is provider-sim's and the server's test client; the TLS pieces come
# with reqwest), so live mode adds features, not new third-party code. The rustls feature only
# makes tokio-tungstenite accept our own rustls config (ring + platform verifier, as the
# importer uses); no OpenSSL anywhere, so the distroless image needs nothing extra.
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
rustls-platform-verifier = "0.7.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# Alpaca gzips trade pages ~7x; reqwest's own gzip feature would pull in new crates, flate2 is locked.
flate2 = { version = "1.1.10", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
