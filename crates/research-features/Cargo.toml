[package]
name = "research-features"
description = "Research-only versioned policies (trade conditions, historical eligibility, splits) and a Rust port of the chart's indicators; production never depends on it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
market-events = { path = "../market-events" }
market-archive = { path = "../market-archive" }
chart-engine = { path = "../chart-engine" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
