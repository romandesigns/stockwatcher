# A push to main ships every part that changed since the last release that
# fully succeeded (docs/CONVENTIONS.md, "Release pipeline"). A red `checks`
# job ships nothing. Diffing against the last *successful* release, not the
# previous push, matters: a run the billing block stopped (2026-10-20, #61)
# leaves its changes unshipped, and the next push must pick them up.
#
# Deploy window (docs/CONVENTIONS.md, "Deploy window"): the server is never
# restarted between 04:00 and 20:00 America/New_York on an NYSE trading day
# (scripts/release/deploy-window.ts). A push inside it still runs its checks,
# but the server deploy, and the desktop and phone releases that may depend on
# its protocol, are deferred; the scheduled run after 20:00 ET ships them. A
# manual run with force=true ignores the window (emergencies only).
name: Release

on:
  push:
    branches: [main]
  # After 20:00 ET, deferred releases go out. 00:07 and 01:07 UTC are 20:07
  # and 21:07 EDT, or 19:07 (still inside: deferred again) and 20:07 EST, so
  # one of them is after the close in either half of the year. A run with
  # nothing pending stops after `changes`.
  schedule:
    - cron: "7 0,1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy now even inside the 04:00-20:00 ET trading-day window (emergencies only)"
        type: boolean
        default: false

# A newer push waits instead of interrupting a deploy halfway. (GitHub
# keeps only the newest pending run per group, so a burst of pushes
# deploys the last one.)
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: What changed since the last full release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      web: ${{ steps.diff.outputs.web }}
      server: ${{ steps.diff.outputs.server }}
      mobile: ${{ steps.diff.outputs.mobile }}
      desktop: ${{ steps.diff.outputs.desktop }}
      # true: the server has something to ship but now is inside the deploy
      # window; server, desktop and mobile wait for the after-hours run.
      hold: ${{ steps.diff.outputs.hold }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Inside the deploy window?
        id: window
        # The holidays come from the server's own NYSE table. A script error
        # fails this job, so nothing ships rather than deploying blind.
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ] && [ "$FORCE" = true ]; then
            printf 'inside=false\nreason=forced by a manual run (force=true)\n' | tee -a "$GITHUB_OUTPUT"
          else
            bun scripts/release/deploy-window.ts | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Diff against the last full release and the live server
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          INSIDE: ${{ steps.window.outputs.inside }}
          WHY: ${{ steps.window.outputs.reason }}
          # Must match the name of the marker step below.
          DEFERRED_STEP: Deploy deferred until after 20:00 ET
          HEALTH_URL: https://stockwatcher.wavystyle.io/api/health
        run: |
          set -euo pipefail
          # The newest successful release that was not deferred: a deferred run
          # ends green with nothing shipped, so it must never become the base.
          # Its marker is the step named $DEFERRED_STEP below. A run whose jobs
          # cannot be read counts as deferred (an older base ships more, never less).
          base=""
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=main&status=success&per_page=30" \
            -q '.workflow_runs[] | "\(.id) \(.head_sha)"' || true)"
          while read -r id sha; do
            [ -n "${id:-}" ] || continue
            marked="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" \
              -q "[.jobs[].steps[]? | select(.name == \"${DEFERRED_STEP}\" and .conclusion == \"success\")] | length" || echo 1)"
            if [ "$marked" = 0 ]; then base="$sha"; break; fi
          done <<< "$runs"
          # A workflow, release script or root manifest change can alter how any
          # part is built or shipped: ship everything.
          all='^\.github/workflows/|^scripts/release/|^package\.json$|^bun\.lock$'
          # What each part is built from. The server image embeds the web app
          # (infra/docker/Dockerfile); the desktop app embeds it too and has no
          # path dependency on crates/*, only the shared Cargo.lock.
          web='^apps/web/|^packages/(shared|app-state|chart-core|chart-web)/'
          rust='^Cargo\.(toml|lock)$|^rust-toolchain\.toml$'
          server_paths="^crates/|^infra/docker/|$web|$rust"
          usable() { [ -n "$1" ] && git cat-file -e "${1}^{commit}" 2>/dev/null; }
          match() { if echo "$2" | grep -qE "$1|$all"; then echo true; else echo false; fi; }
          if usable "$base"; then
            files="$(git diff --name-only "$base" "$GITHUB_SHA")"
            echo "Changed since ${base::7}:"; echo "$files" | sed 's/^/  /'
            web_ship="$(match "$web" "$files")"
            mobile_ship="$(match '^apps/mobile/|^packages/(shared|app-state|chart-core|chart-native)/' "$files")"
            desktop_ship="$(match "^apps/desktop/|$web|$rust" "$files")"
          else
            # No successful release yet, or its commit is gone (force push): ship everything.
            echo "No usable last release (${base:-none}): shipping everything."
            web_ship=true mobile_ship=true desktop_ship=true
          fi
          # The server ships when the commit it is RUNNING (deploy.sh only
          # reports success once /api/health says so) lags this one on server
          # paths. Asking it directly also covers a release whose server job
          # deployed but whose desktop job failed. Unreachable, or a commit
          # this history lacks: fall back to the last full release.
          live="$(curl -fsS --max-time 10 "$HEALTH_URL" | jq -r '.commit // empty' 2>/dev/null || true)"
          if usable "$live"; then
            echo "The live server runs ${live::7}."
            server_ship="$(match "$server_paths" "$(git diff --name-only "$live" "$GITHUB_SHA")")"
          elif usable "$base"; then
            echo "The live server's commit is unknown (${live:-no answer}); diffing the server against ${base::7}."
            server_ship="$(match "$server_paths" "$files")"
          else
            server_ship=true
          fi
          # Hold: the server has something to ship inside the window. The
          # desktop app and the phone OTA wait with it, so no client ships a
          # protocol the live server does not speak yet. A client-only change
          # (server up to date) ships at once.
          hold=false
          if [ "$INSIDE" = true ] && [ "$server_ship" = true ]; then hold=true; fi
          {
            echo "web=$web_ship"
            echo "server=$server_ship"
            echo "mobile=$mobile_ship"
            echo "desktop=$desktop_ship"
            echo "hold=$hold"
          } | tee -a "$GITHUB_OUTPUT" | sed 's/^/ship /' >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy window: ${WHY}" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy deferred until after 20:00 ET
        # Runs only on a hold. Its success is the marker the diff above looks
        # for, so this run never becomes the base of the next one: keep the
        # name and DEFERRED_STEP identical.
        if: ${{ steps.diff.outputs.hold == 'true' }}
        env:
          WHY: ${{ steps.window.outputs.reason }}
        run: |
          {
            echo
            echo "**Deferred:** ${WHY}. The checks still run; the server deploy and the desktop and phone"
            echo "releases go out with the scheduled run after 20:00 ET (or a manual run with force=true)."
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: changes
    # A push inside the window still runs its checks; a scheduled run that is
    # still inside it (19:07 EST) has nothing new to check and stops here.
    if: ${{ !(needs.changes.outputs.hold == 'true' && github.event_name == 'schedule') }}
    uses: ./.github/workflows/ci.yml
    with:
      web: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.desktop == 'true' }}
      server: ${{ needs.changes.outputs.server == 'true' }}
      mobile: ${{ needs.changes.outputs.mobile == 'true' }}
      desktop: ${{ needs.changes.outputs.desktop == 'true' }}

  server:
    name: Server image and VPS deploy
    needs: [changes, checks]
    if: ${{ needs.changes.outputs.server == 'true' && needs.changes.outputs.hold != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://stockwatcher.wavystyle.io
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/romandesigns/stockwatcher-server:${{ github.sha }}
            ghcr.io/romandesigns/stockwatcher-server:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        # The forced command on the VPS runs deploy.sh with this sha as
        # SSH_ORIGINAL_COMMAND. The registry token goes over stdin, never
        # argv. It's this job's GITHUB_TOKEN, which expires when the job ends.
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # fail2ban on the VPS bans addresses after failed SSH logins, and runners share Azure
          # addresses with internet-wide SSH scanners, so a deploy sometimes lands on a banned
          # address and times out ("Connection timed out", 2026-10-20 and 10-22). Wait for
          # port 22 before the one real connection. The probe is a bare TCP connect, never
          # ssh: the forced command deploys on ANY ssh session to this key.
          for try in 1 2 3 4 5; do
            if timeout 10 bash -c "</dev/tcp/${VPS_HOST}/22" 2>/dev/null; then break; fi
            [ "$try" = 5 ] && { echo "::error::VPS port 22 unreachable after 5 tries (~10 min)."; exit 1; }
            echo "VPS port 22 unreachable (try $try), retrying in 150 s"
            sleep 150
          done
          printf '%s\n' "$GHCR_PULL_TOKEN" | ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            "wavystack@${VPS_HOST}" "${GITHUB_SHA}"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Prune old server images
        # Packages storage has a $0 budget (owner, 2026-10-20): every release
        # adds an image of a few hundred MB, so keep the newest 10 (rollback
        # room, SETUP.md "Operating it") and delete the rest. Never fails the
        # release: the deploy above is what matters.
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: stockwatcher-server
          package-type: container
          min-versions-to-keep: 10

  desktop:
    name: Desktop installers and update publish
    needs: [changes, checks]
    if: ${{ needs.changes.outputs.desktop == 'true' && needs.changes.outputs.hold != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://stockwatcher.wavystyle.io/updates/desktop/latest.json
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        # Git Bash: GNU tar and OpenSSH from /usr/bin, same commands as Linux.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install
        run: bun install --frozen-lockfile

      - name: Set version
        id: version
        # This checkout only; the committed version stays 0.1.0. The
        # updater installs a release only if its version is newer, so the
        # run number is what orders releases.
        run: |
          set -euo pipefail
          version="0.1.${GITHUB_RUN_NUMBER}"
          bun apps/desktop/scripts/set-version.ts "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build signed installers
        # beforeBuildCommand builds apps/web first. With the key in the
        # environment, each installer gets a .sig whose trusted comment
        # records the version (the app sets requireSignedVersion).
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --ci

      - name: Stage update files
        # make-latest.ts writes latest.json, applies publish-updates.sh's
        # rules locally and appends the file list to the job summary.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bun apps/desktop/scripts/make-latest.ts \
            --bundle target/release/bundle \
            --out target/updates \
            --version "$VERSION" \
            --notes "${GITHUB_SHA::7}"
          /usr/bin/tar --version | head -n 1
          /usr/bin/tar -czf target/upload.tgz --owner=0 --group=0 --numeric-owner \
            -C target/updates desktop
          /usr/bin/tar -tvzf target/upload.tgz

      - name: Publish to VPS
        # The forced command runs publish-updates.sh, which validates the tar
        # from stdin and swaps /updates/desktop atomically. The version is
        # passed as the release label (SSH_ORIGINAL_COMMAND).
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VPS_PUBLISH_KEY: ${{ secrets.VPS_PUBLISH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          # Not ~/.ssh: the Windows runner refuses mode changes on it.
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_PUBLISH_KEY" > "$RUNNER_TEMP/ssh/publish_key"
          chmod 600 "$RUNNER_TEMP/ssh/publish_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          # Same port-22 wait as the server deploy (fail2ban bans of shared runner addresses).
          for try in 1 2 3 4 5; do
            if timeout 10 bash -c "</dev/tcp/${VPS_HOST}/22" 2>/dev/null; then break; fi
            [ "$try" = 5 ] && { echo "::error::VPS port 22 unreachable after 5 tries (~10 min)."; exit 1; }
            echo "VPS port 22 unreachable (try $try), retrying in 150 s"
            sleep 150
          done
          /usr/bin/ssh \
            -i "$RUNNER_TEMP/ssh/publish_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ConnectTimeout=20 \
            "wavystack@${VPS_HOST}" "$VERSION" < target/upload.tgz
          {
            echo
            echo "Published desktop $VERSION to https://stockwatcher.wavystyle.io/updates/desktop/latest.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"

  mobile:
    name: Mobile OTA update and preview APK
    # Every release that changes the phone app publishes an OTA update. A new APK is queued only when the
    # native fingerprint differs from the latest finished preview build,
    # because EAS build quota is limited and an unchanged native layer
    # would produce an identical APK (docs/CONVENTIONS.md, "Release
    # pipeline").
    needs: [changes, checks]
    if: ${{ needs.changes.outputs.mobile == 'true' && needs.changes.outputs.hold != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      update_group: ${{ steps.update.outputs.group }}
      runtime_version: ${{ steps.fingerprint.outputs.hash }}
      build_url: ${{ steps.build.outputs.url }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Pinned: 25.x shipped 2026-10-15; the build:list JSON shape
      # (runtime.version) was verified on 24.x.
      EAS_CLI: eas-cli@24.14.0
      EAS_BUILDS_URL: https://expo.dev/accounts/creativecoder87/projects/stockwatcher/builds
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Require EXPO_TOKEN
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::The EXPO_TOKEN repository secret is not set."
            exit 1
          fi

      - name: Publish OTA update (channel preview)
        id: update
        run: |
          set -euo pipefail
          bunx "$EAS_CLI" update \
            --channel preview \
            --platform android \
            --environment preview \
            --message "$GITHUB_SHA" \
            --non-interactive \
            --json > "$RUNNER_TEMP/update.json"
          # The update is already live; a JSON shape change must not fail the job.
          group="$(jq -r 'if type == "array" then (.[0].group // "") else "" end' "$RUNNER_TEMP/update.json" 2>/dev/null || true)"
          echo "group=${group}" >> "$GITHUB_OUTPUT"
          echo "OTA update published to channel preview, group \`${group:-unknown}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Fingerprint of this commit
        id: fingerprint
        # Same computation `eas build` records as runtime.version, with the
        # preview profile's environment applied.
        run: |
          set -euo pipefail
          bunx "$EAS_CLI" fingerprint:generate \
            --platform android \
            --build-profile preview \
            --json > "$RUNNER_TEMP/fingerprint.json"
          hash="$(jq -r '.hash // empty' "$RUNNER_TEMP/fingerprint.json")"
          if [ -z "$hash" ]; then
            echo "::error::Could not compute the native fingerprint."
            exit 1
          fi
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"

      - name: Runtime of the latest finished preview build
        id: latest
        run: |
          set -euo pipefail
          bunx "$EAS_CLI" build:list \
            --platform android \
            --buildProfile preview \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive > "$RUNNER_TEMP/builds.json"
          # eas-cli 24 exposes this as runtime.version, not runtimeVersion.
          runtime="$(jq -r '.[0].runtime.version // empty' "$RUNNER_TEMP/builds.json")"
          echo "runtime=${runtime}" >> "$GITHUB_OUTPUT"

      - name: Queue preview APK build if the native layer changed
        id: build
        env:
          HEAD_RUNTIME: ${{ steps.fingerprint.outputs.hash }}
          BUILT_RUNTIME: ${{ steps.latest.outputs.runtime }}
        run: |
          set -euo pipefail
          if [ -n "$BUILT_RUNTIME" ] && [ "$BUILT_RUNTIME" = "$HEAD_RUNTIME" ]; then
            echo "OTA only: native fingerprint \`${HEAD_RUNTIME}\` matches the latest preview build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Native fingerprint \`${HEAD_RUNTIME}\` differs from the latest preview build (\`${BUILT_RUNTIME:-none}\`); queueing a build."
          bunx "$EAS_CLI" build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait \
            --json > "$RUNNER_TEMP/build.json"
          # The build is already queued; an unparsable reply links the list.
          id="$(jq -r 'if type == "array" then (.[0].id // "") else (.id // "") end' "$RUNNER_TEMP/build.json" 2>/dev/null || true)"
          if [ -n "$id" ]; then
            url="${EAS_BUILDS_URL}/${id}"
          else
            echo "::warning::eas build gave no build id; see the builds list."
            url="${EAS_BUILDS_URL}"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Preview APK build queued: ${url}" >> "$GITHUB_STEP_SUMMARY"

  # --- summary: added once desktop and mobile exist -------------------------
  # summary:
  #   needs: [server, desktop, mobile]
  #   if: always()
