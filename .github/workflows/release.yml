# Every push to main ships everything (docs/CONVENTIONS.md, "Release
# pipeline"). A red `checks` job ships nothing.
name: Release

on:
  push:
    branches: [main]

# A newer push waits instead of interrupting a deploy halfway. (GitHub
# keeps only the newest pending run per group, so a burst of pushes
# deploys the last one.)
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  server:
    name: Server image and VPS deploy
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://stockwatcher.wavystyle.io
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/romandesigns/stockwatcher-server:${{ github.sha }}
            ghcr.io/romandesigns/stockwatcher-server:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        # The forced command on the VPS runs deploy.sh with this sha as
        # SSH_ORIGINAL_COMMAND. The registry token goes over stdin, never
        # argv. It's this job's GITHUB_TOKEN, which expires when the job ends.
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$GHCR_PULL_TOKEN" | ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            "wavystack@${VPS_HOST}" "${GITHUB_SHA}"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

