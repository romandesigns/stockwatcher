# The checks that gate a release. release.yml calls this workflow as its
# `checks` job with which parts changed, so a push runs only the checks of
# the parts it ships (owner, 2026-10-20: Actions spend keeps hitting the
# billing limit, and work now goes straight to main without PRs). A
# pull_request run (none are opened any more) still runs everything: an
# absent input is null, and null != false.
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      web:
        type: boolean
        default: true
      server:
        type: boolean
        default: true
      mobile:
        type: boolean
        default: true
      desktop:
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Supersede stale PR runs; never cancel the run gating a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: Web and shared (test, lint, build)
    if: ${{ inputs.web != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install
        run: bun install --frozen-lockfile
      # Every pure package the clients share: the protocol, the chart model and the app store
      # (chart-core and chart-web had no CI step until app-state was added; 2026-10-18).
      - name: Shared packages
        run: |
          for p in shared app-state chart-core chart-web; do
            bun run --filter @stockwatcher/$p typecheck
            bun run --filter @stockwatcher/$p lint
            bun run --filter @stockwatcher/$p test
          done
      - name: Web app
        run: |
          bun run --filter @stockwatcher/web lint
          bun run --filter @stockwatcher/web test
          bun run --filter @stockwatcher/web build
      # The release pipeline's own scripts (the deploy window, release.yml), with the server's
      # NYSE holiday table they read. Any change to them ships everything, so this job runs.
      - name: Release scripts
        run: bun test scripts/release

  server:
    name: Server (fmt, clippy, test)
    if: ${{ inputs.server != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        # rustup reads rust-toolchain.toml and installs the pinned version.
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # -p, not --workspace: the workspace also holds the Tauri crate, which
      # needs WebKitGTK on Linux. The `desktop` job checks it on Windows.
      - name: Clippy
        run: cargo clippy -p stockwatcher-server -p market-events -p chart-engine -p market-archive -p market-replay -p market-providers -p provider-sim -p paper-broker -p stock-context --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p stockwatcher-server -p market-events -p chart-engine -p market-archive -p market-replay -p market-providers -p provider-sim -p paper-broker -p stock-context --locked

  mobile:
    name: Mobile (typecheck, lint, test, doctor, bundle)
    if: ${{ inputs.mobile != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Typecheck, lint and test
        run: |
          bun run typecheck
          bun run lint
          bun run test
      - name: Expo doctor
        # Tolerates only same-version duplicates from Bun's isolated linker;
        # the reasoning is in apps/mobile/scripts/doctor-policy.ts.
        run: bun run doctor
      - name: JS bundle builds (Android export)
        run: bunx expo export --platform android --output-dir "$RUNNER_TEMP/mobile-export"
      - name: Dependency advisories (non-blocking)
        # Report only. On 2026-10-16 the advisories were braces 3.0.3 and
        # node-forge 1.4.0 (no fixed release) and uuid 7.0.3, all reached
        # through Metro / Expo CLI / config-plugin build tooling and none
        # in the app bundle. Making this blocking would freeze every
        # release until upstream ships fixes; review the warning instead.
        working-directory: .
        run: |
          if ! bun audit; then
            echo "::warning title=bun audit::Dependency advisories reported (non-blocking); see this step's log."
          fi

  desktop:
    name: Desktop (clippy, test, release scripts)
    # Windows, like the release build: no WebKitGTK packages to keep in sync.
    # Billed at twice the Linux rate, so it runs only when desktop ships.
    if: ${{ inputs.desktop != false }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Release scripts (set-version, make-latest)
        run: |
          bun run --filter @stockwatcher/desktop typecheck
          bun run --filter @stockwatcher/desktop lint
          bun run --filter @stockwatcher/desktop test
      - name: Web build
        # tauri::generate_context!() embeds apps/web/dist at compile time,
        # so the crate doesn't compile without it.
        run: bun run --filter @stockwatcher/web build
      - name: Clippy
        run: cargo clippy -p stockwatcher-desktop --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p stockwatcher-desktop --locked
