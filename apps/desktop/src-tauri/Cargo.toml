[package]
name = "stockwatcher-desktop"
description = "stockwatcher desktop shell (Tauri v2) around apps/web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib target's name distinct from the binary's,
# which avoids a Windows-only PDB name collision (cargo#8519).
name = "stockwatcher_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
# Used by the code tauri::generate_context!() expands to (plugin config).
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-log = "2.10.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-os = "2.4.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
tauri-plugin-window-state = "2.5.0"
tokio = { version = "1.53.3", features = ["time", "sync"] }
