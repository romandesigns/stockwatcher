# Lives at ~/apps/stockwatcher/docker-compose.yml on the VPS, next to .env
# (secrets, hand-made per host) and image.env (written by deploy.sh).
# Always run compose with the tag file, e.g.
#   docker compose --env-file image.env ps
name: stockwatcher

services:
  server:
    image: ghcr.io/romandesigns/stockwatcher-server:${STOCKWATCHER_IMAGE_TAG:?run via deploy.sh or pass --env-file image.env}
    restart: unless-stopped
    # Loopback only: Caddy (systemd, on the host) is the public entry point.
    ports:
      - "127.0.0.1:8790:8790"
    env_file: .env
    environment:
      # Preserved originals past LIVE_ORIGINAL_DAYS are copied to the Pi and only then
      # deleted here. `originals/` exists only on the Pi's share, so with the share not
      # mounted this path is missing and the recorder keeps everything (SETUP.md, section 9).
      LIVE_ORIGINAL_DURABLE_DIR: /durable/originals
    volumes:
      - stockwatcher_data:/app/data
      # The Pi's NFS share, mounted on the host by infra/vps/durable-mount.sh. rslave: a
      # mount that arrives or comes back after the container started is seen without a restart.
      - /mnt/stockwatcher-durable:/durable:rslave
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Replay opens every symbol file of the day at once (a k-way merge): a
    # real SIP day is ~6,800 files, far past Docker's default soft limit of
    # 1024, and the provider then fails with "Too many open files".
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # The rolling replay archive: keeps the last 21 SIP trading days (a trading
  # month) on the shared volume (imports each new day after 21:15 ET, deletes
  # days older than the window, refreshes assets.json and daily-closes.json,
  # which the server reloads on its own). Same image and tag as the server, so
  # deploy.sh moves both together. Rules and variables:
  # crates/market-providers/src/import/maintain.rs. Status: one log line per
  # cycle (`docker compose --env-file image.env logs --tail 20 archiver`) and
  # archive/plans/maintainer-status.json on the volume (SETUP.md, section 7).
  archiver:
    image: ghcr.io/romandesigns/stockwatcher-server:${STOCKWATCHER_IMAGE_TAG:?run via deploy.sh or pass --env-file image.env}
    restart: unless-stopped
    entrypoint: ["/app/swimport"]
    command: ["maintain"]
    # Same .env as the server: STOCKWATCHER_API_TOKEN (to ask the server which
    # day it is replaying before deleting anything), ALPACA_API_KEY /
    # ALPACA_API_SECRET (added by the owner; without them it imports and
    # deletes nothing and says so in every cycle's log line), PRICE_BAND_*.
    env_file: .env
    environment:
      # The server on the compose network, not the host's loopback port.
      STOCKWATCHER_SERVER_URL: http://server:8790
    volumes:
      - stockwatcher_data:/app/data
    # No ports: it only talks out (Alpaca) and to the server.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image's HEALTHCHECK probes the server's port, which this container
    # does not have; its health is its log line and status file.
    healthcheck:
      disable: true
    # A whole month's plan plus 12 workers' pages in flight stays well under
    # 1 GB; the limit only stops a runaway from taking the server's memory
    # (a real replay day needs 8-13 GB of the box's 31).
    mem_limit: 2g
    # SIGTERM stops new symbol-days; running ones finish and commit. One busy
    # symbol can take a minute of pages. Killed earlier it is still safe (only
    # a .partial file is left, re-fetched next cycle), just wasted work.
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # The float and news collector for the Ross Panel (stock context): FMP float
  # once per trading day at 07:00 ET (bulk pages), Alpaca/Benzinga news every
  # 60 s from 04:00 to 20:00 ET, both appended to archive/evidence/ on the
  # shared volume, which the server reads with STOCK_CONTEXT=1 (it never calls
  # a provider itself). Same image and tag as the server, so deploy.sh moves
  # all three together. Rules and variables:
  # crates/market-providers/src/import/evidence_collect.rs and
  # docs/stock-context/float-news-plan.md. Status: a start line saying which
  # keys are set, then one line per tick that made a request
  # (`docker compose --env-file image.env logs --tail 20 evidence`).
  evidence:
    image: ghcr.io/romandesigns/stockwatcher-server:${STOCKWATCHER_IMAGE_TAG:?run via deploy.sh or pass --env-file image.env}
    restart: unless-stopped
    entrypoint: ["/app/swimport"]
    command: ["evidence"]
    # Same .env as the server: FMP_API_KEY (float) and ALPACA_API_KEY /
    # ALPACA_API_SECRET (news), added by the owner on this host (SETUP.md,
    # section 10). A missing key only turns its half off, and the start line
    # says `NOT SET`. PRICE_BAND_* sets the float universe.
    env_file: .env
    volumes:
      - stockwatcher_data:/app/data
    # No ports: it only talks out (FMP, Alpaca).
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image's HEALTHCHECK probes the server's port, which this container
    # does not have; its health is its log.
    healthcheck:
      disable: true
    # At start it rebuilds its state from the stored records (every float
    # retrieval so far, ~50 MB a month at bulk refresh, and 60 days of news),
    # then holds a day of floats and the news index: a few hundred MB at most
    # after months. The limit only stops a runaway from taking the server's
    # memory.
    mem_limit: 1g
    # SIGTERM cuts its sleeps short and it stops after the current tick; a
    # tick's records are appended as whole lines (a torn last line is skipped
    # by every reader), so being killed mid-append loses at most that line.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  stockwatcher_data:
    # Fixed name (not project-prefixed) so publish-updates.sh and backups
    # can address it directly.
    name: stockwatcher_data
